version: "3.8"

services:
  # PostgreSQL Database
  db:
    container_name: git_pr_plugin_db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-git_pr_plugin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-git_pr_plugin}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network
    restart: unless-stopped

  # Go Application
  app:
    container_name: git_pr_plugin_app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Application settings
      APP_NAME: ${APP_NAME:-Git_PR_plugin_avito_tech}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      HTTP_PORT: ${HTTP_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Database connection (используем имя сервиса 'db' как хост)
      PG_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-git_pr_plugin}?sslmode=disable
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge